<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link 
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body class="page">
    <aside class="matrix" aria-label="Eisenhower Matrix">
      <h2 class="matrix__title matrix__title--hidden" aria-hidden="true">Eisenhower Matrix</h2>
      <img class="matrix__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix illustration">
      <a 
        class="matrix__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </aside>
    <main class="app" aria-label="Todo App">
      <h1 class="app__title app__title--hidden" aria-hidden="true">Todo App</h1>
      <section class="task-creator" aria-label="Add Item">
        <h2 class="task-creator__title">Add Item</h2>
        <form class="task-creator__form" action="#" onsubmit="return false;">
          <label class="task-creator__label">
            <input class="task-creator__input" type="text">
          </label>
          <button class="task-creator__btn" type="submit">Add</button>
        </form>
      </section>
      <section class="task task--todo" aria-label="Todo">
        <h2 class="task__title" aria-hidden="true">Todo</h2>
        <ul class="task__list task__list--todo">
          <li class="task__item">
            <input class="task__checkbox" type="checkbox" aria-label="Pay Bills">
            <label class="task__label">Pay Bills</label>
            <input type="text" class="task__input" aria-label="Edit task 'Pay Bills'">
            <button class="task__btn task__btn--edit" aria-label="Edit task 'Pay Bills'">Edit</button>
            <button class="task__btn task__btn--delete" aria-label="Delete task 'Pay Bills'">
              <img class="task__btn-icon" src="./remove.svg" alt="">
            </button>
          </li>
          <li class="task__item task__item--edit-mode">
            <input class="task__checkbox" type="checkbox" aria-label="Go Shopping">
            <label class="task__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task__input" aria-label="Edit task 'Go Shopping'">
            <button class="task__btn task__btn--edit" aria-label="Save task 'Go Shopping'">Save</button>
            <button class="task__btn task__btn--delete" aria-label="Delete task 'Go Shopping'">
              <img class="task__btn-icon" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
      <section class="task task--completed" aria-label="Completed">
      <h2 class="task__title">Completed</h2>
        <ul class="task__list task__list--completed">
          <li class="task__item">
            <input class="task__checkbox" type="checkbox" aria-label="See the Doctor" checked>
            <label class="task__label">See the Doctor</label>
            <input type="text" class="task__input" aria-label="Edit task 'See the Doctor'">
            <button class="task__btn task__btn--edit" aria-label="Edit task 'See the Doctor'">Edit</button>
            <button class="task__btn task__btn--delete" aria-label="Delete task 'See the Doctor'">
              <img class="task__btn-icon" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
